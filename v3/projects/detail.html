<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project - Skill Bench V3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>

  <main class="mx-auto max-w-7xl px-6 py-6">

    <div class="flex items-center gap-2 text-sm text-slate-500 mb-3">
      <a href="list.html" class="hover:text-slate-900">Projects</a>
      <span>/</span>
      <span id="proj-crumb" class="text-slate-900 font-medium">...</span>
    </div>

    <!-- Header -->
    <div class="bg-white border border-slate-200 rounded-lg p-5 mb-4 flex flex-wrap items-start gap-4 justify-between">
      <div class="min-w-0 flex-1">
        <div class="text-xs text-slate-500 mb-1" id="proj-customer"></div>
        <h1 id="proj-name" class="text-2xl font-semibold text-slate-900"></h1>
        <p id="proj-desc" class="text-sm text-slate-500 mt-1"></p>
      </div>
      <div class="flex items-center gap-2">
        <span id="proj-status-pill" class="pill pill-running">Status</span>
        <button class="text-xs px-3 py-1.5 rounded bg-white border border-slate-200 hover:bg-slate-50">Edit</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar mb-4">
      <button data-tab="batches" class="active">Batches</button>
      <button data-tab="delivery">Delivery Batches</button>
      <button data-tab="members">Members</button>
      <button data-tab="settings">Settings</button>
    </div>

    <!-- Tab: batches -->
    <div id="tab-batches" class="space-y-4">
      <div class="flex items-center justify-between">
        <div class="text-sm text-slate-500">A batch groups tasks with shared constraints (deadline, criteria, customer).</div>
        <button class="inline-flex items-center gap-2 px-3 py-1.5 text-sm rounded-md bg-indigo-600 text-white hover:bg-indigo-700">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path d="M12 5v14M5 12h14"/></svg>
          New batch
        </button>
      </div>
      <div id="batches-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </div>

    <!-- Tab: delivery -->
    <div id="tab-delivery" hidden class="space-y-4">
      <div class="text-sm text-slate-500">A delivery batch is a frozen subset of approved tasks packaged for the customer.</div>
      <div id="delivery-list" class="space-y-2"></div>
    </div>

    <!-- Tab: members -->
    <div id="tab-members" hidden class="space-y-3">
      <div class="text-sm text-slate-500">People with access to this project.</div>
      <div class="bg-white border border-slate-200 rounded-lg divide-y divide-slate-100" id="members-list"></div>
    </div>

    <!-- Tab: settings -->
    <div id="tab-settings" hidden class="space-y-3">
      <div class="bg-white border border-slate-200 rounded-lg p-5 space-y-4 max-w-2xl">
        <div>
          <label class="text-sm font-medium text-slate-700">Project name</label>
          <input class="mt-1 w-full px-3 py-2 text-sm border border-slate-200 rounded-md" id="set-name">
        </div>
        <div>
          <label class="text-sm font-medium text-slate-700">Description</label>
          <textarea class="mt-1 w-full px-3 py-2 text-sm border border-slate-200 rounded-md" rows="3" id="set-desc"></textarea>
        </div>
        <div>
          <label class="text-sm font-medium text-slate-700">Customer</label>
          <input class="mt-1 w-full px-3 py-2 text-sm border border-slate-200 rounded-md" id="set-cust">
        </div>
        <div class="flex items-center justify-between border-t border-slate-200 pt-4">
          <button class="text-sm text-red-600 hover:text-red-700">Archive project</button>
          <button class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-700 text-white text-sm">Save changes</button>
        </div>
      </div>
    </div>

  </main>

  <div id="toast-container"></div>

  <script src="../assets/data.js"></script>
  <script src="../assets/script.js"></script>
  <script>
    SB.setRole((new URLSearchParams(location.search).get('as')) || 'pm');
    SB.renderNav();

    const slug = new URLSearchParams(location.search).get('project') || 'acme-coding';
    const proj = SBData.projects.find(p => p.slug === slug) || SBData.projects[0];
    document.getElementById('proj-crumb').textContent = proj.name;
    document.getElementById('proj-customer').textContent = proj.customer;
    document.getElementById('proj-name').textContent = proj.name;
    document.getElementById('proj-desc').textContent = proj.description;
    document.getElementById('proj-status-pill').textContent = proj.status.charAt(0).toUpperCase() + proj.status.slice(1);
    document.getElementById('proj-status-pill').className = 'pill ' + (proj.status === 'paused' ? 'pill-pending' : proj.status === 'closed' ? 'pill-passed' : 'pill-running');
    document.getElementById('set-name').value = proj.name;
    document.getElementById('set-desc').value = proj.description;
    document.getElementById('set-cust').value = proj.customer;

    /* Batches list */
    const batchesEl = document.getElementById('batches-list');
    const projBatches = SBData.batches.filter(b => b.projectSlug === proj.slug);
    if (projBatches.length === 0) {
      batchesEl.innerHTML = '<div class="text-sm text-slate-500 col-span-2 italic">No batches yet.</div>';
    } else {
      projBatches.forEach(b => {
        const pill = b.status === 'closed' ? 'pill pill-passed' : b.status === 'in-progress' ? 'pill pill-running' : 'pill pill-pending';
        const pct = Math.min(100, Math.round((b.tasks / b.target) * 100));
        const card = document.createElement('a');
        card.href = '../batches/detail.html?project=' + encodeURIComponent(proj.slug) + '&batch=' + encodeURIComponent(b.slug);
        card.className = 'group bg-white border border-slate-200 rounded-lg p-4 hover:border-indigo-300';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="font-medium text-slate-900 group-hover:text-indigo-700">${b.name}</div>
              <div class="text-xs text-slate-500 mt-1">Deadline ${b.deadline}</div>
            </div>
            <span class="${pill}">${b.status}</span>
          </div>
          <div class="mt-3">
            <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
              <span>${b.tasks} / ${b.target} tasks</span>
              <span>${pct}%</span>
            </div>
            <div class="w-full h-1.5 rounded bg-slate-100 overflow-hidden">
              <div class="h-full bg-indigo-500" style="width: ${pct}%"></div>
            </div>
          </div>`;
        batchesEl.appendChild(card);
      });
    }

    /* Delivery list */
    const dlist = document.getElementById('delivery-list');
    const projBatchIds = new Set(projBatches.map(b => b.id));
    const projDeliveries = SBData.deliveryBatches.filter(d => projBatchIds.has(d.batchId));
    if (projDeliveries.length === 0) {
      dlist.innerHTML = '<div class="text-sm text-slate-500 italic">No delivery batches yet.</div>';
    } else {
      projDeliveries.forEach(d => {
        const row = document.createElement('a');
        row.href = '../delivery-batches/detail.html?id=' + encodeURIComponent(d.id);
        row.className = 'bg-white border border-slate-200 rounded-lg p-4 flex items-start gap-4 hover:border-indigo-300';
        const pill = d.status === 'delivered' ? 'pill pill-passed' : 'pill pill-pending';
        row.innerHTML = `
          <div class="w-9 h-9 rounded bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path d="M16 16V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12"/><path d="M20 22H4M4 18l4-4 4 4 4-4 4 4"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-medium text-slate-900">${d.name}</div>
            <div class="text-xs text-slate-500 mt-0.5">${d.tasksCount} tasks - ${d.recipient}</div>
          </div>
          <div class="text-right">
            <span class="${pill}">${d.status}</span>
            <div class="text-[11px] text-slate-400 mt-1">${d.deliveredAt || 'not yet'}</div>
          </div>`;
        dlist.appendChild(row);
      });
    }

    /* Members */
    const members = [
      { name: 'Priya Kapoor', role: 'Project Manager', initials: 'PK', color: '#7c3aed' },
      { name: 'Jane Doe',     role: 'Prompter',        initials: 'JD', color: '#4f46e5' },
      { name: 'Sam Allen',    role: 'Prompter',        initials: 'SA', color: '#4f46e5' },
      { name: 'Tara Wu',      role: 'Tester',          initials: 'TW', color: '#10b981' },
      { name: 'Bob Smith',    role: 'Reviewer',        initials: 'BS', color: '#f59e0b' },
    ];
    const memEl = document.getElementById('members-list');
    members.forEach(m => {
      const row = document.createElement('div');
      row.className = 'px-4 py-3 flex items-center gap-3';
      row.innerHTML = `
        <div class="avatar" style="background: ${m.color}">${m.initials}</div>
        <div class="flex-1">
          <div class="text-sm font-medium text-slate-900">${m.name}</div>
          <div class="text-xs text-slate-500">${m.role}</div>
        </div>
        <button class="text-xs text-slate-400 hover:text-red-600">Remove</button>`;
      memEl.appendChild(row);
    });

    /* Tab switcher */
    document.querySelectorAll('.tab-bar button[data-tab]').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab-bar button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        for (const k of ['batches','delivery','members','settings']) {
          const el = document.getElementById('tab-' + k);
          if (k === b.dataset.tab) el.removeAttribute('hidden'); else el.setAttribute('hidden','');
        }
      });
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Tasks - Skill Bench</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css?v=4">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="max-w-7xl">
    <div class="flex items-end justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">All Tasks</h1>
        <p class="text-sm text-slate-500 mt-1">View, filter, and manage all tasks in the pipeline</p>
      </div>
    </div>

    <!-- Lifecycle tabs (Rework is split out so blocked tasks are easy to find). -->
    <div id="tabs" class="flex flex-wrap gap-1.5 mb-3"></div>

    <!-- Filters -->
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <div class="relative flex-1 max-w-xs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Search tasks..." class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <select id="filter-status" class="px-3 py-2 text-sm border border-slate-300 rounded-lg">
        <option value="">All statuses</option>
      </select>
      <select id="filter-domain" class="px-3 py-2 text-sm border border-slate-300 rounded-lg">
        <option value="">All domains</option>
      </select>
      <span class="text-xs text-slate-500" id="result-count"></span>
    </div>

    <!-- Tasks table -->
    <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-xs uppercase text-slate-500">
          <tr>
            <th class="text-left px-4 py-3">Task</th>
            <th class="text-left px-4 py-3">Prompter</th>
            <th class="text-left px-4 py-3">Tester</th>
            <th class="text-left px-4 py-3">Status</th>
            <th class="text-left px-4 py-3">Domain</th>
            <th class="text-right px-4 py-3">Actions</th>
          </tr>
        </thead>
        <tbody id="tasks-tbody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>

  <!-- Assign Modal -->
  <div id="assign-overlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm">
      <div class="px-6 py-4 border-b border-slate-200">
        <h3 class="font-semibold">Assign task</h3>
        <p class="text-xs text-slate-500 mt-0.5" id="assign-task-name"></p>
      </div>
      <div class="px-6 py-5 space-y-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Assign to</label>
          <select id="assign-to" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></select>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
        <button id="assign-cancel" class="px-4 py-2 text-sm font-medium text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">Cancel</button>
        <button id="assign-confirm" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">Assign</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../assets/data.js?v=4"></script>
  <script src="../assets/script.js?v=4"></script>
  <script>
    if (!SB.requireRole('projectManager')) throw 'auth';
    SB.renderNav();

    // Populate filters
    const statusSel = document.getElementById('filter-status');
    Object.entries(SBData.STATUS).forEach(([k, v]) => { statusSel.innerHTML += `<option value="${k}">${v.label}</option>`; });
    const domainSel = document.getElementById('filter-domain');
    SBData.skillDomains.forEach(d => { domainSel.innerHTML += `<option value="${d.id}">${d.name}</option>`; });

    const search = document.getElementById('search-input');
    const tbody = document.getElementById('tasks-tbody');
    const resultCount = document.getElementById('result-count');
    const tabsEl = document.getElementById('tabs');

    const TABS = [
      { id: 'all',        label: 'All',         match: () => true },
      { id: 'new',        label: 'New',         match: t => t.status === 'prompter-draft' },
      { id: 'inprogress', label: 'In progress', match: t => ['domain-review','with-tester','in-review'].includes(t.status) },
      { id: 'rework',     label: 'Rework',      match: t => t.status === 'changes-requested' },
      { id: 'completed',  label: 'Completed',   match: t => ['approved','published'].includes(t.status) },
    ];
    let activeTab = 'all';
    // Allow deep links from the dashboard KPIs: ?tab=rework / ?status=with-tester.
    const urlParams = new URLSearchParams(location.search);
    if (urlParams.get('tab') && TABS.some(x => x.id === urlParams.get('tab'))) activeTab = urlParams.get('tab');
    if (urlParams.get('status') && SBData.STATUS[urlParams.get('status')]) statusSel.value = urlParams.get('status');
    function countFor(id) { const tab = TABS.find(x => x.id === id); return SBData.tasks.filter(tab.match).length; }
    function renderTabs() {
      tabsEl.innerHTML = TABS.map(tab => {
        const active = tab.id === activeTab;
        const isRework = tab.id === 'rework';
        const cnt = countFor(tab.id);
        const cls = active ? (isRework ? 'bg-amber-600 text-white' : 'bg-indigo-600 text-white')
                           : (isRework && cnt > 0 ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50');
        return `<button data-tab="${tab.id}" class="px-3 py-1.5 text-xs font-medium rounded-full ${cls}">${tab.label}<span class="ml-1 opacity-70">${cnt}</span></button>`;
      }).join('');
      tabsEl.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { activeTab = b.dataset.tab; renderTabs(); renderTasks(); }));
    }

    function renderTasks() {
      const q = search.value.toLowerCase().trim();
      const st = statusSel.value;
      const dom = domainSel.value;
      const tab = TABS.find(x => x.id === activeTab);
      let filtered = SBData.tasks.filter(t => {
        if (!tab.match(t)) return false;
        if (q && !t.name.toLowerCase().includes(q) && !(t.description||'').toLowerCase().includes(q)) return false;
        if (st && t.status !== st) return false;
        if (dom && t.domain !== dom) return false;
        return true;
      });
      resultCount.textContent = filtered.length + ' tasks';
      tbody.innerHTML = '';
      filtered.forEach(t => {
        const s = SBData.STATUS[t.status];
        const reworkNote = (t.status === 'changes-requested' && t.reworkReason) ? `<div class="mt-1 text-[10px] text-amber-700">Rework (${SB.escapeHtml(t.changesTarget||'')}): ${SB.escapeHtml(t.reworkReason)}</div>` : '';
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50';
        tr.innerHTML = `
          <td class="px-4 py-3"><div class="font-mono text-xs font-medium">${SB.escapeHtml(t.name)}</div><div class="text-[10px] text-slate-500 mt-0.5">${SB.escapeHtml((t.description||'').slice(0,55))}</div>${reworkNote}</td>
          <td class="px-4 py-3 text-xs">${t.prompter ? SB.escapeHtml(t.prompter.name) : '<span class=\"text-slate-400\">Unassigned</span>'}</td>
          <td class="px-4 py-3 text-xs">${t.tester ? SB.escapeHtml(t.tester.name) : '<span class=\"text-slate-400\">Unassigned</span>'}</td>
          <td class="px-4 py-3"><span class="pill ${s.cls}">${s.label}</span></td>
          <td class="px-4 py-3 text-xs text-slate-500">${SB.escapeHtml(SBData.domainLabel(t.domain))}</td>
          <td class="px-4 py-3 text-right"><button data-id="${t.id}" class="assign-btn text-xs text-indigo-600 hover:text-indigo-700 font-medium">Assign</button></td>`;
        tbody.appendChild(tr);
      });
      document.querySelectorAll('.assign-btn').forEach(b => b.addEventListener('click', () => openAssign(b.dataset.id)));
    }

    search.addEventListener('input', renderTasks);
    statusSel.addEventListener('change', renderTasks);
    domainSel.addEventListener('change', renderTasks);

    // Assign modal
    const assignOverlay = document.getElementById('assign-overlay');
    let assignTaskId = null;

    function openAssign(id) {
      assignTaskId = id;
      const t = SBData.getTaskById(id);
      document.getElementById('assign-task-name').textContent = t ? t.name : '';
      const sel = document.getElementById('assign-to');
      sel.innerHTML = '<option value="">Select person...</option>';
      // Suggest people whose ROLES are relevant to the task's current stage.
      // Multi-role aware: a user qualifies if they hold ANY of the target roles.
      const targetRoleKeys = t && t.status === 'with-tester' ? ['tester']
                           : t && t.status === 'prompter-draft' ? ['prompter']
                           : ['prompter','tester','domainReviewer','taskReviewer'];
      SBData.allUsers.filter(u => u.status === 'active' && SBData.userRoleKeys(u).some(r => targetRoleKeys.includes(r))).forEach(u => {
        const roleLabels = SBData.userRoleKeys(u).map(SBData.roleLabel).join(', ');
        sel.innerHTML += `<option value="${u.id}">${u.name} (${roleLabels})</option>`;
      });
      assignOverlay.classList.remove('hidden'); assignOverlay.classList.add('flex');
    }

    document.getElementById('assign-cancel').addEventListener('click', () => { assignOverlay.classList.add('hidden'); assignOverlay.classList.remove('flex'); });
    assignOverlay.addEventListener('click', (e) => { if (e.target === assignOverlay) { assignOverlay.classList.add('hidden'); assignOverlay.classList.remove('flex'); } });

    document.getElementById('assign-confirm').addEventListener('click', () => {
      const userId = document.getElementById('assign-to').value;
      if (!userId) { SB.toast('Please select a person', 'error'); return; }
      const user = SBData.allUsers.find(u => u.id === userId);
      const task = SBData.getTaskById(assignTaskId);
      if (task && user) {
        var assignee = { id: user.id, name: user.name, initials: user.initials, email: user.email, role: user.role };
        var roles = SBData.userRoleKeys(user);
        // Prefer the slot the task currently needs; otherwise fall back to the
        // user's first relevant role. Multi-role users can fill any slot they hold.
        var slot = task.status === 'with-tester' && roles.includes('tester') ? 'tester'
                 : task.status === 'prompter-draft' && roles.includes('prompter') ? 'prompter'
                 : roles.includes('tester') ? 'tester'
                 : roles.includes('prompter') ? 'prompter'
                 : roles.includes('domainReviewer') ? 'domainReviewer'
                 : roles.includes('taskReviewer') ? 'taskReviewer' : null;
        if (slot) task[slot] = assignee;
        SB.toast('Assigned "' + task.name.split('/')[1] + '" to ' + user.name, 'success');
      }
      assignOverlay.classList.add('hidden'); assignOverlay.classList.remove('flex');
      renderTabs();
      renderTasks();
    });

    renderTabs();
    renderTasks();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review queue - Skill Bench MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css?v=4">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="max-w-7xl">
    <h1 class="text-2xl font-bold">Review queue</h1>
    <p class="text-sm text-slate-500 mt-1">Tasks where the Tester ran Oracle PASS. Approve to publish, or request changes back to Prompter or Tester.</p>
    <div class="flex flex-wrap items-center justify-between gap-3 mt-5 mb-4">
      <div class="tab-bar">
        <button data-tab="pending" class="active">Pending <span id="cnt-pending" class="text-xs bg-amber-100 text-amber-700 rounded-full px-1.5 py-0.5 ml-1">0</span></button>
        <button data-tab="changes">Rework <span id="cnt-changes" class="text-xs bg-orange-100 text-orange-700 rounded-full px-1.5 py-0.5 ml-1">0</span></button>
        <button data-tab="done">Approved / Published <span id="cnt-done" class="text-xs bg-emerald-100 text-emerald-700 rounded-full px-1.5 py-0.5 ml-1">0</span></button>
      </div>
      <div class="flex items-center gap-2">
        <select id="filter-domain" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-amber-200"><option value="">All domains</option></select>
        <input id="search" type="text" placeholder="Search..." class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg w-48 focus:ring-2 focus:ring-amber-200 focus:border-amber-400">
      </div>
    </div>
    <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-xs font-medium text-slate-500 uppercase">
          <tr>
            <th class="text-left px-4 py-3">Task</th>
            <th class="text-left px-4 py-3">Prompter</th>
            <th class="text-left px-4 py-3">Tester</th>
            <th class="text-left px-4 py-3">Oracle</th>
            <th class="text-left px-4 py-3">Status</th>
            <th class="px-2 py-3"></th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
      </table>
      <div id="empty" class="hidden py-16 text-center text-slate-500 text-sm">No tasks in this tab.</div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../assets/data.js?v=4"></script>
  <script src="../assets/script.js?v=4"></script>
  <script>
    if (!SB.requireRole('taskReviewer')) throw 'auth';
    SB.renderNav();
    const FILTERS = {
      pending: t => t.status === 'in-review',
      changes: t => t.status === 'changes-requested',
      done: t => t.status === 'approved' || t.status === 'published',
    };
    function counts() {
      document.getElementById('cnt-pending').textContent = SBData.tasks.filter(FILTERS.pending).length;
      document.getElementById('cnt-changes').textContent = SBData.tasks.filter(FILTERS.changes).length;
      document.getElementById('cnt-done').textContent = SBData.tasks.filter(FILTERS.done).length;
    }
    const domainSel = document.getElementById('filter-domain');
    SBData.skillDomains.forEach(d => { domainSel.innerHTML += '<option value="' + d.id + '">' + SB.escapeHtml(d.name) + '</option>'; });
    counts();
    function render(tab) {
      var q = (document.getElementById('search').value || '').trim().toLowerCase();
      var dom = domainSel.value;
      const list = SBData.tasks.filter(function(t) {
        if (!FILTERS[tab](t)) return false;
        if (dom && t.domain !== dom) return false;
        if (q && !(t.name + ' ' + t.description + ' ' + SBData.domainLabel(t.domain) + ' ' + (t.prompter ? t.prompter.name : '') + ' ' + (t.tester ? t.tester.name : '')).toLowerCase().includes(q)) return false;
        return true;
      });
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      document.getElementById('empty').classList.toggle('hidden', list.length > 0);
      list.forEach(t => {
        const st = SBData.STATUS[t.status];
        const oracle = t.oraclePassed
          ? `<span class="text-xs text-emerald-700">PASS ${t.oracleReward != null ? t.oracleReward.toFixed(2) : ''}</span>`
          : '<span class="text-xs text-slate-400">—</span>';
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 cursor-pointer';
        const reworkNote = (tab === 'changes' && t.reworkReason) ? `<div class="mt-1 text-[11px] text-orange-700 bg-orange-50 border border-orange-100 rounded px-2 py-1">Rework (${SB.escapeHtml(t.changesTarget || '')}): ${SB.escapeHtml(t.reworkReason)}</div>` : '';
        tr.innerHTML = `
          <td class="px-4 py-3"><div class="font-mono font-medium">${SB.escapeHtml(t.name)}</div><div class="text-xs text-slate-500">${SB.escapeHtml(t.description)}</div>${reworkNote}</td>
          <td class="px-4 py-3">${SB.escapeHtml(t.prompter ? t.prompter.name : '—')}</td>
          <td class="px-4 py-3">${t.tester ? SB.escapeHtml(t.tester.name) : '—'}</td>
          <td class="px-4 py-3">${oracle}</td>
          <td class="px-4 py-3"><span class="pill ${st.cls}">${st.label}</span>${t.changesTarget ? `<div class="text-[10px] text-slate-500 mt-0.5">needs: ${t.changesTarget}</div>` : ''}</td>
          <td class="px-2 py-3 text-right text-xs text-indigo-600 font-medium">Open &rarr;</td>`;
        tr.onclick = () => location.href = 'workspace.html?id=' + t.id;
        tbody.appendChild(tr);
      });
    }
    var activeTab = 'pending';
    render('pending');
    document.querySelectorAll('.tab-bar button[data-tab]').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab-bar button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeTab = b.dataset.tab;
        render(activeTab);
      });
    });
    document.getElementById('search').addEventListener('input', function() { render(activeTab); });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review - Skill Bench MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="mx-auto max-w-7xl px-6 py-6">
    <div class="text-sm text-slate-500 mb-4"><a href="queue.html">Review queue</a> / <span id="bc-name" class="font-mono text-slate-900"></span></div>
    <header class="bg-white border border-slate-200 rounded-lg p-5 mb-4 flex flex-wrap justify-between gap-4">
      <div>
        <div class="flex items-center gap-3">
          <h1 id="t-name" class="text-xl font-semibold font-mono"></h1>
          <span id="t-status" class="pill"></span>
        </div>
        <p id="t-desc" class="text-sm text-slate-500 mt-1"></p>
        <div id="t-meta" class="text-xs text-slate-500 mt-2 flex flex-wrap gap-2"></div>
      </div>
      <div id="action-bar" class="flex flex-wrap gap-2 items-start"></div>
    </header>
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_22rem] gap-4">
      <div class="bg-white border border-slate-200 rounded-lg p-5">
        <div class="font-semibold mb-3">Harbor folder</div>
        <div id="harbor-preview"></div>
      </div>
      <aside class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-lg p-5">
          <div class="font-semibold mb-3">Comments</div>
          <div id="comments-list" class="space-y-3 text-sm mb-3"></div>
          <textarea id="new-comment" rows="2" placeholder="Add a note..." class="w-full px-3 py-2 text-sm border rounded-md"></textarea>
          <button id="add-comment" class="mt-2 text-xs px-3 py-1.5 rounded bg-slate-100 hover:bg-slate-200">Add comment</button>
        </div>
        <div class="bg-white border border-slate-200 rounded-lg p-5">
          <div class="font-semibold mb-3">History</div>
          <ol id="history-list" class="space-y-3 text-sm border-l-2 border-slate-200 pl-4"></ol>
        </div>
      </aside>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../assets/data.js"></script>
  <script src="../assets/script.js"></script>
  <script>
    SB.setRole('reviewer');
    SB.renderNav();
    const id = new URLSearchParams(location.search).get('id');
    const t = id ? SBData.getTaskById(id) : SBData.tasks.find(x => x.status === 'in-review');
    if (!t.comments) t.comments = [];
    if (!t.history) t.history = [];

    function refresh() {
      document.getElementById('bc-name').textContent = t.name;
      document.getElementById('t-name').textContent = t.name;
      document.getElementById('t-desc').textContent = t.description;
      const st = SBData.STATUS[t.status];
      const statusEl = document.getElementById('t-status');
      statusEl.className = 'pill ' + st.cls;
      statusEl.textContent = st.label;
      document.getElementById('t-meta').innerHTML = [
        `Trainer: <b>${SB.escapeHtml(t.trainer.name)}</b>`,
        t.tester ? `Tester: <b>${SB.escapeHtml(t.tester.name)}</b>` : '',
        t.oraclePassed ? `Oracle: <b class="text-emerald-700">PASS</b>` : `Oracle: <span class="text-slate-400">not run</span>`,
        `Domain: <b>${SB.escapeHtml(t.domain)}</b>`,
      ].filter(Boolean).join(' &middot; ');
      renderActions();
      renderComments();
      renderHistory();
      SB.renderHarborPreview('harbor-preview', t);
    }

    function renderActions() {
      const bar = document.getElementById('action-bar');
      bar.innerHTML = '';
      if (t.status === 'in-review') {
        const canApprove = !!t.oraclePassed;
        bar.innerHTML = `
          <button id="btn-changes" class="px-3 py-1.5 text-sm border rounded-md hover:bg-slate-50">Request changes</button>
          <button id="btn-approve" ${canApprove ? '' : 'disabled'}
            class="px-3 py-1.5 text-sm rounded-md font-medium ${canApprove ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-slate-200 text-slate-500 cursor-not-allowed'}"
            title="${canApprove ? '' : 'Oracle must PASS'}">Approve &amp; publish</button>`;
        document.getElementById('btn-changes').onclick = () => SB.renderRequestChangesModal(t, ({ body, target }) => {
          t.comments.push({ author: SBData.users.reviewer, when: 'just now', body });
          t.status = 'changes-requested';
          t.changesTarget = target;
          t.updatedAt = 'just now';
          t.history.push({ when: 'just now', who: SBData.users.reviewer.name, event: 'Requested changes (' + target + ')' });
          SB.toast('Changes requested.', 'success');
          refresh();
        });
        if (canApprove) document.getElementById('btn-approve').onclick = approve;
      } else if (t.status === 'changes-requested') {
        bar.innerHTML = `<span class="text-xs text-slate-500">Waiting on <b>${t.changesTarget}</b> to address feedback.</span>`;
      } else if (t.status === 'published' || t.status === 'approved') {
        bar.innerHTML = `<span class="text-xs px-2 py-1 rounded bg-emerald-50 text-emerald-700 font-medium">${SBData.STATUS[t.status].label}</span>`;
      }
    }

    function renderComments() {
      const list = document.getElementById('comments-list');
      list.innerHTML = t.comments.length ? '' : '<p class="text-xs text-slate-400 italic">No comments.</p>';
      t.comments.forEach(c => {
        const d = document.createElement('div');
        d.className = 'border rounded-md p-3';
        d.innerHTML = `<div class="text-xs text-slate-500">${SB.escapeHtml(c.author.name)} · ${SB.escapeHtml(c.when)}</div><div class="mt-1">${SB.escapeHtml(c.body)}</div>`;
        list.appendChild(d);
      });
    }

    function renderHistory() {
      const hist = document.getElementById('history-list');
      hist.innerHTML = '';
      (t.history || []).forEach(h => {
        const li = document.createElement('li');
        li.className = 'relative';
        li.innerHTML = `<span class="absolute -left-[1.4rem] top-1.5 w-3 h-3 rounded-full bg-amber-500 border-2 border-white"></span>
          <div>${SB.escapeHtml(h.event)}</div><div class="text-xs text-slate-500">${SB.escapeHtml(h.who)} · ${SB.escapeHtml(h.when)}</div>`;
        hist.appendChild(li);
      });
    }

    function approve() {
      const now = 'just now';
      t.status = 'published';
      t.updatedAt = now;
      t.history.push({ when: now, who: SBData.users.reviewer.name, event: 'Approved + published to Harbor registry' });
      SB.toast('Task published.', 'success');
      refresh();
    }

    document.getElementById('add-comment').onclick = () => {
      const body = document.getElementById('new-comment').value.trim();
      if (!body) return;
      t.comments.push({ author: SBData.users.reviewer, when: 'just now', body });
      document.getElementById('new-comment').value = '';
      renderComments();
      SB.toast('Comment added.', 'success');
    };

    refresh();
  </script>
</body>
</html>

<!doctype html>
<!--
  ============================================================================
  PAGE:     Prompter · Task brief (wizard step 1)
  ROLE:     prompter            (access guard: SB.requireRole('prompter'))
  FLOW:     dashboard.html → wizard-1-brief → wizard-2-skills  (prompter-draft /
            prompter-rework working copy in session)
  PURPOSE:  Capture task identity: name, description, domain, difficulty.
  READS (SBData): getWizardTaskFromSession(), getWizardTaskId(), skillDomains.
  CAPTURES/WRITES: sessionStorage wizard task via SB.saveWizardTaskToSession:
            name, description, domain, difficulty.
  ACTIONS:  "Next: Skills" → wizard-2-skills.html; Save & Exit / Cancel → dashboard.
  AI-FIRST NOTE: first wizard step that writes core task metadata to the session copy.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brief - Prompter - Skill Bench MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css?v=4">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="max-w-5xl">
    <div class="flex justify-between mb-4 text-sm text-slate-500">
      <span><a href="dashboard.html" class="hover:text-slate-900">My Tasks</a> / New task</span>
      <a href="dashboard.html" class="hover:text-slate-900">Save &amp; Exit</a>
    </div>
    <div id="wizard-stepper" class="mb-8 stepper-prompter"></div>
    <div class="grid grid-cols-1 lg:grid-cols-[14rem_1fr] gap-6">
      <aside class="bg-white border border-slate-200 rounded-lg p-4 h-fit text-sm text-slate-600">
        <div class="text-xs font-semibold uppercase text-slate-500 mb-2">Step 1 — Brief</div>
        <p>Identity fields for the task. No technical setup here.</p>
        <ul class="mt-3 list-disc pl-4 space-y-1">
          <li><b>Domain</b> is free text: finance, legal, python, etc.</li>
          <li>Name uses <code class="bg-slate-100 px-1 rounded text-xs">org/task-name</code></li>
        </ul>
      </aside>
      <section class="bg-white border border-slate-200 rounded-lg p-6 space-y-5">
        <h2 class="text-lg font-semibold">Task brief</h2>
        <div>
          <label class="block text-sm font-medium mb-1" for="f-name">Task name</label>
          <input id="f-name" type="text" placeholder="my-org/task-name"
                 class="w-full max-w-md px-3 py-2 text-sm border border-slate-200 rounded-md font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="f-desc">Description (one line)</label>
          <input id="f-desc" type="text" placeholder="What should the agent accomplish?"
                 class="w-full px-3 py-2 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-200">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="f-domain">Domain</label>
          <!-- Domain is chosen from the platform taxonomy so it maps cleanly to
               skill filters, reviewer routing, and dashboards. -->
          <select id="f-domain" class="w-full max-w-md px-3 py-2 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200">
            <option value="">Select a domain...</option>
          </select>
          <p class="text-xs text-slate-500 mt-1">Helps route your task to the right reviewers and skills.</p>
        </div>
        <div>
          <div class="text-sm font-medium mb-2">Difficulty</div>
          <div class="flex gap-2" id="f-diff-group">
            <label class="diff-opt px-3 py-1.5 text-sm border border-slate-200 rounded-md cursor-pointer hover:bg-slate-50">
              <input type="radio" name="diff" value="easy" class="accent-indigo-600 mr-1"> Easy
            </label>
            <label class="diff-opt px-3 py-1.5 text-sm border border-slate-200 rounded-md cursor-pointer hover:bg-slate-50">
              <input type="radio" name="diff" value="medium" class="accent-indigo-600 mr-1" checked> Medium
            </label>
            <label class="diff-opt px-3 py-1.5 text-sm border border-slate-200 rounded-md cursor-pointer hover:bg-slate-50">
              <input type="radio" name="diff" value="hard" class="accent-indigo-600 mr-1"> Hard
            </label>
          </div>
        </div>
      </section>
    </div>
    <div class="mt-8 flex justify-between">
      <a href="dashboard.html" class="text-sm text-slate-600 hover:text-slate-900">Cancel</a>
      <a id="next" href="wizard-2-skills.html"
         class="inline-flex items-center gap-2 px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-md font-medium">
        Next: Skills
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../assets/data.js?v=4"></script>
  <script src="../assets/script.js?v=4"></script>
  <script>
    if (!SB.requireRole('prompter')) throw 'auth';
    SB.renderNav();
    SB.renderWizardStepper(1, 'prompter');

    function wizHref(path) {
      const id = SB.getWizardTaskId();
      return path + (id ? '?id=' + encodeURIComponent(id) : '');
    }

    const t = SB.getWizardTaskFromSession();
    const domainSel = document.getElementById('f-domain');
    SBData.skillDomains.forEach(d => { domainSel.innerHTML += `<option value="${d.id}">${SB.escapeHtml(d.name)}</option>`; });
    document.getElementById('f-name').value = t.name || '';
    document.getElementById('f-desc').value = t.description || '';
    domainSel.value = t.domain || '';
    const diff = t.difficulty || 'medium';
    const diffRadio = document.querySelector(`input[name="diff"][value="${diff}"]`);
    if (diffRadio) diffRadio.checked = true;

    document.getElementById('next').href = wizHref('wizard-2-skills.html');

    function persist() {
      t.name = document.getElementById('f-name').value.trim();
      t.description = document.getElementById('f-desc').value.trim();
      t.domain = document.getElementById('f-domain').value.trim();
      const d = document.querySelector('input[name="diff"]:checked');
      if (d) t.difficulty = d.value;
      SB.saveWizardTaskToSession(t);
    }

    ['f-name', 'f-desc'].forEach(id => {
      document.getElementById(id).addEventListener('input', persist);
    });
    domainSel.addEventListener('change', persist);
    document.querySelectorAll('input[name="diff"]').forEach(r => r.addEventListener('change', persist));
    document.getElementById('next').addEventListener('click', persist);
  </script>
</body>
</html>

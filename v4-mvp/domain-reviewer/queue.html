<!doctype html>
<!--
  ============================================================================
  PAGE:        Domain Reviewer · Review queue
  ROLE:        domainReviewer      (access guard: SB.requireRole('domainReviewer'))
  ROUTE:       domain-reviewer/queue.html
  PURPOSE:     List tasks awaiting domain review or previously returned to the prompter;
               filter and open a task in the review workspace.

  ── FLOW / WORKFLOW ───────────────────────────────────────────────────────
  ENTRY:       app nav / domain-reviewer hub → queue.html
  EXIT:        → domain-reviewer/workspace.html?id=<taskId>   (row click)
  LIFECYCLE:   Pending review tab: status domain-review (post-prompter submit).
               Returned for rework tab: status changes-requested, changesTarget=prompter.
  ACTOR/ACTIONS: Domain Reviewer. Switch tabs; search; filter by domain; row click opens
               workspace (CTA "Review" on pending, "View" on rework).
  PERMISSIONS: read-only list; approve/reject/edit happen in workspace.html.

  ── DATA (DB design) ──────────────────────────────────────────────────────
  ENTITY:      Task (list rows)
  READS:       SBData.tasks, STATUS, skillDomains, domainLabel
  WRITES:      none on this page.
  FIELDS SHOWN:
     name            : string   : task identifier (mono)
     description     : string   : one-line summary
     prompter        : UserRef  : FK → User (author)
     domain          : enum(id) : FK → Domain (badge)
     updatedAt       : string   : submission / last update time
     reworkReason    : string   : shown on rework tab ("Sent back: …")
  RELATIONSHIPS: Task n—1 Prompter; Task n—1 Domain; pending rows precede tester assignment.

  ── UI / UX ───────────────────────────────────────────────────────────────
  LAYOUT:      h1 + count badge · subtitle · pill tabs · search + domain filter ·
               task table · empty state with icon.
  COMPONENTS:  dynamic tab buttons (Pending review / Returned for rework + counts),
               search input, domain <select>, table (Task, Prompter, Domain, Submitted,
               CTA), #empty panel, #count-badge (active tab list length).
  STATES:      empty queue message when no rows match; rework tab uses amber styling when
               count > 0; search + domain filter re-render table live.

  AI-FIRST NOTE: gateway queue between prompter submit (domain-review) and tester pool
               (with-tester after approve); rework tab tracks prompter-targeted bounce-backs.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domain review queue - Skill Bench MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css?v=4">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="max-w-7xl">
    <div class="flex items-center gap-3 mb-1">
      <h1 class="text-2xl font-bold">Domain review queue</h1>
      <span id="count-badge" class="text-xs bg-violet-100 text-violet-700 rounded-full px-2 py-0.5 font-medium">0</span>
    </div>
    <p class="text-sm text-slate-500 mt-1">Review problem statements, verifiers, and golden solutions from Prompters before tasks enter the tester pool.</p>
    <div id="tabs" class="flex flex-wrap gap-1.5 mt-5 mb-3"></div>
    <div class="flex items-center gap-3 mb-4">
      <input id="search" type="text" placeholder="Search tasks..." class="px-3 py-2 text-sm border border-slate-300 rounded-lg w-64 focus:ring-2 focus:ring-violet-200 focus:border-violet-400">
      <select id="filter-domain" class="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-violet-200">
        <option value="">All domains</option>
      </select>
    </div>
    <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-xs font-medium text-slate-500 uppercase">
          <tr>
            <th class="text-left px-4 py-3">Task</th>
            <th class="text-left px-4 py-3">Prompter</th>
            <th class="text-left px-4 py-3">Domain</th>
            <th class="text-left px-4 py-3">Submitted</th>
            <th class="px-2 py-3"></th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
      </table>
      <div id="empty" class="hidden py-16 text-center text-slate-500 text-sm">
        <svg class="mx-auto w-12 h-12 text-slate-300 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="font-medium text-slate-700">No tasks pending domain review</p>
      </div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../assets/data.js?v=4"></script>
  <script src="../assets/script.js?v=4"></script>
  <script>
    if (!SB.requireRole('domainReviewer')) throw 'auth';
    SB.renderNav();

    var search = document.getElementById('search');
    var domainSel = document.getElementById('filter-domain');
    var tabsEl = document.getElementById('tabs');
    SBData.skillDomains.forEach(function(d) {
      domainSel.innerHTML += '<option value="' + d.id + '">' + SB.escapeHtml(d.name) + '</option>';
    });

    // Pending = awaiting this reviewer's decision. Rework = tasks this reviewer
    // returned to the prompter for changes (kept separate so the active queue
    // stays focused on actionable items).
    var TABS = [
      { id: 'pending', label: 'Pending review', match: function(t) { return t.status === 'domain-review'; } },
      { id: 'rework',  label: 'Returned for rework', match: function(t) { return t.status === 'changes-requested' && t.changesTarget === 'prompter'; } },
    ];
    var activeTab = 'pending';

    function countFor(id) { var tab = TABS.find(function(x){return x.id===id;}); return SBData.tasks.filter(tab.match).length; }

    function renderTabs() {
      tabsEl.innerHTML = TABS.map(function(tab) {
        var active = tab.id === activeTab;
        var isRework = tab.id === 'rework';
        var cnt = countFor(tab.id);
        var cls = active ? (isRework ? 'bg-amber-600 text-white' : 'bg-violet-600 text-white')
                         : (isRework && cnt > 0 ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50');
        return '<button data-tab="' + tab.id + '" class="px-3 py-1.5 text-xs font-medium rounded-full ' + cls + '">' + tab.label + '<span class="ml-1 opacity-70">' + cnt + '</span></button>';
      }).join('');
      tabsEl.querySelectorAll('[data-tab]').forEach(function(b) { b.addEventListener('click', function() { activeTab = b.dataset.tab; renderTabs(); render(); }); });
    }

    function render() {
      var q = search.value.trim().toLowerCase();
      var dom = domainSel.value;
      var tab = TABS.find(function(x){return x.id===activeTab;});
      var list = SBData.tasks.filter(function(t) {
        if (!tab.match(t)) return false;
        if (dom && t.domain !== dom) return false;
        if (q && !(t.name + ' ' + t.description + ' ' + SBData.domainLabel(t.domain)).toLowerCase().includes(q)) return false;
        return true;
      });
      document.getElementById('count-badge').textContent = list.length;
      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      document.getElementById('empty').classList.toggle('hidden', list.length > 0);
      list.forEach(function(t) {
        var isRework = activeTab === 'rework';
        var reworkNote = (isRework && t.reworkReason) ? '<div class="mt-1 text-[11px] text-amber-700">Sent back: ' + SB.escapeHtml(t.reworkReason) + '</div>' : '';
        var tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 cursor-pointer';
        tr.innerHTML = '<td class="px-4 py-3"><div class="font-medium font-mono text-slate-900">' + SB.escapeHtml(t.name) + '</div><div class="text-xs text-slate-500 mt-0.5">' + SB.escapeHtml(t.description) + '</div>' + reworkNote + '</td>' +
          '<td class="px-4 py-3">' + SB.escapeHtml(t.prompter ? t.prompter.name : '—') + '</td>' +
          '<td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded bg-slate-100">' + SB.escapeHtml(SBData.domainLabel(t.domain)) + '</span></td>' +
          '<td class="px-4 py-3 text-slate-500">' + SB.escapeHtml(t.updatedAt) + '</td>' +
          '<td class="px-2 py-3 text-right text-xs text-violet-600 font-medium">' + (isRework ? 'View' : 'Review') + ' &rarr;</td>';
        tr.onclick = function() { location.href = 'workspace.html?id=' + encodeURIComponent(t.id); };
        tbody.appendChild(tr);
      });
    }
    search.addEventListener('input', render);
    domainSel.addEventListener('change', render);
    renderTabs();
    render();
  </script>
</body>
</html>

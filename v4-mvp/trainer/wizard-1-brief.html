<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brief - Trainer - Skill Bench MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="mx-auto max-w-5xl px-6 py-6">
    <div class="flex justify-between mb-4 text-sm text-slate-500">
      <span><a href="dashboard.html" class="hover:text-slate-900">My Tasks</a> / New task</span>
      <a href="dashboard.html">Save &amp; Exit</a>
    </div>
    <div id="wizard-stepper" class="mb-8 stepper-trainer"></div>
    <div class="grid grid-cols-1 lg:grid-cols-[14rem_1fr] gap-6">
      <aside class="bg-white border border-slate-200 rounded-lg p-4 h-fit text-sm text-slate-600">
        <div class="text-xs font-semibold uppercase text-slate-500 mb-2">Step 1 — Brief</div>
        <p>Identity fields for the task. No technical setup here.</p>
        <ul class="mt-3 list-disc pl-4 space-y-1">
          <li><b>Domain</b> is free text: finance, legal, python, etc.</li>
          <li>Name uses <code class="bg-slate-100 px-1 rounded text-xs">org/task-name</code></li>
        </ul>
      </aside>
      <section class="bg-white border border-slate-200 rounded-lg p-6 space-y-5">
        <h2 class="text-lg font-semibold">Task brief</h2>
        <div>
          <label class="block text-sm font-medium mb-1">Task name</label>
          <input id="f-name" type="text" class="w-full max-w-md px-3 py-2 text-sm border rounded-md font-mono">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Description (one line)</label>
          <input id="f-desc" type="text" class="w-full px-3 py-2 text-sm border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Domain</label>
          <input id="f-domain" type="text" placeholder="e.g. finance, data-analysis, legal, marketing"
                 class="w-full max-w-md px-3 py-2 text-sm border rounded-md">
          <p class="text-xs text-slate-500 mt-1">Any field — helps testers and reviewers route your task.</p>
        </div>
        <div>
          <div class="text-sm font-medium mb-2">Difficulty</div>
          <div class="flex gap-2" id="f-diff-group">
            <label class="diff-opt px-3 py-1.5 text-sm border rounded-md cursor-pointer"><input type="radio" name="diff" value="easy" class="accent-indigo-600"> Easy</label>
            <label class="diff-opt px-3 py-1.5 text-sm border rounded-md cursor-pointer"><input type="radio" name="diff" value="medium" class="accent-indigo-600" checked> Medium</label>
            <label class="diff-opt px-3 py-1.5 text-sm border rounded-md cursor-pointer"><input type="radio" name="diff" value="hard" class="accent-indigo-600"> Hard</label>
          </div>
        </div>
      </section>
    </div>
    <div class="mt-8 flex justify-between">
      <a href="dashboard.html" class="text-sm text-slate-600">Cancel</a>
      <a id="next" href="wizard-2-instruction.html" class="px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-md">Next: Problem &rarr;</a>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../assets/data.js"></script>
  <script src="../assets/script.js"></script>
  <script>
    SB.setRole('trainer');
    SB.renderNav();
    SB.renderWizardStepper(1, 'trainer');
    const t = SB.getWizardTaskFromSession();
    document.getElementById('f-name').value = t.name || '';
    document.getElementById('f-desc').value = t.description || '';
    document.getElementById('f-domain').value = t.domain || '';
    document.querySelector(`input[name="diff"][value="${t.difficulty || 'medium'}"]`).checked = true;
    function persist() {
      t.name = document.getElementById('f-name').value;
      t.description = document.getElementById('f-desc').value;
      t.domain = document.getElementById('f-domain').value;
      const d = document.querySelector('input[name="diff"]:checked');
      if (d) t.difficulty = d.value;
      SB.saveWizardTaskToSession(t);
    }
    ['f-name','f-desc','f-domain'].forEach(id => document.getElementById(id).addEventListener('input', persist));
    document.querySelectorAll('input[name="diff"]').forEach(r => r.addEventListener('change', persist));
    document.getElementById('next').addEventListener('click', e => { persist(); });
  </script>
</body>
</html>

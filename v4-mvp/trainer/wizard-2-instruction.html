<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Problem - Trainer - Skill Bench MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="mx-auto max-w-6xl px-6 py-6">
    <div class="flex justify-between mb-4 text-sm text-slate-500">
      <span><a href="dashboard.html">My Tasks</a> / New task</span>
      <a href="dashboard.html">Save &amp; Exit</a>
    </div>
    <div id="wizard-stepper" class="mb-8 stepper-trainer"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <section class="bg-white border border-slate-200 rounded-lg overflow-hidden flex flex-col">
        <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between">
          <div>
            <h2 class="text-sm font-semibold">Problem statement</h2>
            <p class="text-xs text-slate-500">What should the AI agent do? Be specific about file paths and expected outputs.</p>
          </div>
          <label class="inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs border border-dashed border-slate-300 rounded-md cursor-pointer hover:bg-indigo-50 hover:border-indigo-400 transition-colors">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            Import
            <input id="file-upload" type="file" accept=".md,.txt" class="hidden">
          </label>
        </div>
        <textarea id="f-instr" class="w-full px-4 py-3 text-sm border-0 font-mono flex-1 min-h-[22rem] resize-none" placeholder="# Task Title&#10;&#10;Create a script that...&#10;&#10;## Requirements&#10;1. Read input from `/app/input.txt`&#10;2. Process it and write output to `/app/output.json`&#10;&#10;## Expected output format&#10;```json&#10;{&quot;result&quot;: ...}&#10;```"></textarea>
      </section>
      <section class="bg-white border border-slate-200 rounded-lg overflow-hidden flex flex-col">
        <div class="px-5 py-3 border-b border-slate-200">
          <span class="text-sm font-semibold">Preview</span>
          <span class="text-xs text-slate-500 ml-2">instruction.md</span>
        </div>
        <div id="md-preview" class="p-4 prose prose-sm max-w-none text-slate-700 bg-slate-50 flex-1 min-h-[22rem] overflow-y-auto scroll-y whitespace-pre-wrap text-sm"></div>
      </section>
    </div>
    <div class="mt-6">
      <div class="text-sm font-medium mb-2">Harbor preview (partial)</div>
      <div id="harbor-preview"></div>
    </div>
    <div class="mt-8 flex justify-between">
      <a href="wizard-1-brief.html" class="text-sm text-slate-600">Back</a>
      <a id="next" href="wizard-3-criteria.html" class="px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-md">Next: Criteria &rarr;</a>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../assets/data.js"></script>
  <script src="../assets/script.js"></script>
  <script>
    SB.setRole('trainer');
    SB.renderNav();
    SB.renderWizardStepper(2, 'trainer');
    const t = SB.getWizardTaskFromSession();
    const ta = document.getElementById('f-instr');
    const prev = document.getElementById('md-preview');
    ta.value = t.instructionMd || '';
    function refresh() {
      t.instructionMd = ta.value;
      SB.saveWizardTaskToSession(t);
      prev.textContent = ta.value || '(empty)';
      SB.renderHarborPreview('harbor-preview', t, { initial: 'instruction.md' });
    }
    ta.addEventListener('input', refresh);
    refresh();
    document.getElementById('file-upload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function() {
        ta.value = reader.result;
        refresh();
        SB.toast('Imported ' + file.name, 'success');
      };
      reader.readAsText(file);
      e.target.value = '';
    });
    document.getElementById('next').addEventListener('click', refresh);
  </script>
</body>
</html>

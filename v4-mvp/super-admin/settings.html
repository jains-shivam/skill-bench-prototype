<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Skill Bench</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css?v=3">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app-nav"></div>
  <main class="max-w-7xl">
    <div class="mb-6">
      <h1 class="text-2xl font-bold tracking-tight">Platform Settings</h1>
      <p class="text-sm text-slate-500 mt-1">Configure system-wide preferences and integrations</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[14rem_1fr] gap-6">
      <!-- Settings nav -->
      <nav class="space-y-1">
        <button data-tab="general" class="settings-tab active w-full text-left px-3 py-2 rounded-lg text-sm font-medium">General</button>
        <button data-tab="auth" class="settings-tab w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Authentication</button>
      </nav>

      <!-- Settings content -->
      <div class="space-y-4">
        <div id="tab-general" class="settings-panel">
          <div class="bg-white border border-slate-200 rounded-lg p-6 space-y-5">
            <h2 class="text-lg font-semibold">General settings</h2>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Organization name</label>
              <input type="text" value="my-org" class="w-full max-w-sm px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Platform display name</label>
              <input type="text" value="Skill Bench" class="w-full max-w-sm px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Default task difficulty</label>
              <select class="px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option>easy</option><option selected>medium</option><option>hard</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Oracle timeout (seconds)</label>
              <input type="number" value="600" class="w-32 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div class="pt-3 border-t border-slate-200">
              <button onclick="SB.toast('Settings saved','success')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg">Save changes</button>
            </div>
          </div>
        </div>

        <div id="tab-auth" class="settings-panel hidden">
          <div class="bg-white border border-slate-200 rounded-lg p-6 space-y-5">
            <h2 class="text-lg font-semibold">Authentication</h2>
            <div class="flex items-center justify-between p-4 border border-slate-200 rounded-lg">
              <div><div class="text-sm font-medium">SSO / SAML</div><div class="text-xs text-slate-500">Enable single sign-on for your organization</div></div>
              <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" class="sr-only peer"><div class="w-9 h-5 bg-slate-200 peer-checked:bg-indigo-600 rounded-full peer-focus:ring-2 peer-focus:ring-indigo-500 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"></div></label>
            </div>
            <div class="flex items-center justify-between p-4 border border-slate-200 rounded-lg">
              <div><div class="text-sm font-medium">Two-factor authentication</div><div class="text-xs text-slate-500">Require 2FA for all users</div></div>
              <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" checked class="sr-only peer"><div class="w-9 h-5 bg-slate-200 peer-checked:bg-indigo-600 rounded-full peer-focus:ring-2 peer-focus:ring-indigo-500 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"></div></label>
            </div>
            <div class="flex items-center justify-between p-4 border border-slate-200 rounded-lg">
              <div><div class="text-sm font-medium">Session duration</div><div class="text-xs text-slate-500">How long users stay signed in</div></div>
              <select class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg"><option>8 hours</option><option selected>24 hours</option><option>7 days</option><option>30 days</option></select>
            </div>
            <div class="pt-3 border-t border-slate-200">
              <button onclick="SB.toast('Auth settings saved','success')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg">Save changes</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../assets/data.js?v=3"></script>
  <script src="../assets/script.js?v=3"></script>
  <script>
    if (!SB.requireAuth()) throw 'auth';
    SB.setRole('superAdmin');
    SB.renderNav();

    // Tab switching
    document.querySelectorAll('.settings-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.settings-tab').forEach(t => { t.classList.remove('active','bg-indigo-50','text-indigo-700'); t.classList.add('text-slate-600'); });
        tab.classList.add('active','bg-indigo-50','text-indigo-700');
        tab.classList.remove('text-slate-600');
        document.querySelectorAll('.settings-panel').forEach(p => p.classList.add('hidden'));
        document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
      });
    });
    document.querySelector('.settings-tab[data-tab="general"]').classList.add('bg-indigo-50','text-indigo-700');
  </script>
</body>
</html>
